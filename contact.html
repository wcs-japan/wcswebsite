<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ | White Coat Society Japan</title>

    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

    <link rel="stylesheet" href="contact.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap"
  rel="stylesheet"
>

  </head>

  <body>
    <header class="header">
  <a href="index.html" class="logo">
    <img src="images/logo.png" alt="WCS Logo" />
  </a>

<nav class="nav">
  <a href="index.html" data-i18n="nav.home">ホーム</a>
  <a href="news.html" data-i18n="nav.news">ニュース</a>
  <a href="about.html" data-i18n="nav.about">WCSについて</a>
  <a href="contact.html" data-i18n="nav.contact">お問い合わせ</a>
</nav>

 <div class="language-switch">
    <button type="button" class="lang-btn" id="language-toggle">
      日本語 / EN
    </button>
  </div>


</header>

    <section class="contact-hero">
  <h1 data-i18n="contact.heroTitle">- お問い合わせ -</h1>
  <p data-i18n="contact.heroSubtitle">Contact info</p>
</section>

    <main class="contact-container">
      <div class="contact-list">
        <div class="contact-info" id="email-card">
          <div class="icon-box">
    <img src="images/Gmail.svg" alt="Gmail" class="gmail-logo" />
          </div>

          <span id="email-text">
            whitecoatsociety.japan@gmail.com
          </span>
        </div>

        <a
          href="https://www.instagram.com/wcs_japan/"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-info instagram"
        >
          <div class="icon-box instagram-icon">
            <i class="fa-brands fa-instagram"></i>
          </div>

          <span>whitecoatsociety.japan</span>
        </a>

        <a
  href="https://x.com/WCS_japan_ofc"
  target="_blank"
  rel="noopener noreferrer"
  class="contact-info twitter"
>
  <div class="icon-box twitter-icon">
    <i class="fa-brands fa-x-twitter"></i>
  </div>

  <span>@WCS_japan_ofc</span>
</a>
      </div>


      <section class="form-section">
       <h2 data-i18n="contact.formTitle">お問い合わせフォーム</h2>

        <form id="contact-form">
          <div class="form-group">
<label for="name" data-i18n="contact.name">お名前</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="お名前を入力してください"
              required
            />
          </div>

          <div class="form-group">
<label for="email" data-i18n="contact.email">メールアドレス</label>            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="form-group">
<label for="subject" data-i18n="contact.subject">件名</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="件名を入力してください"
              required
            />
          </div>

          <div class="form-group">
<label for="message" data-i18n="contact.message">お問い合わせ内容</label>            <textarea
              id="message"
              name="message"
              rows="7"
              placeholder="お問い合わせ内容を入力してください"
              required
            ></textarea>
          </div>

        <button type="submit" class="submit-btn" id="submit-btn">
  <span data-i18n="contact.submit">送信</span>
  <i class="fa-solid fa-paper-plane"></i>
</button>
          <p id="form-error" class="form-error"></p>
        </form>
      </section>
    </main>

    <a
      href="https://discord.gg/UCfJjAPaS"
      target="_blank"
      rel="noopener noreferrer"
      class="discord-btn"
      aria-label="Discord"
    >
      <i class="fa-brands fa-discord"></i>
    </a>

    <div id="toast" class="toast">
      アドレスをコピーしました
    </div>

    <div id="success-popup" class="success-popup">
      <div class="success-popup-content">
        <div class="success-icon">
          <i class="fa-solid fa-check"></i>
        </div>

        <h3>送信をしました</h3>

        <p>
          お問い合わせありがとうございます。<br />
          内容を確認後、ご連絡いたします。
        </p>

        <button id="close-success-popup">OK</button>
      </div>
    </div>

    <script src="contact.js"></script>
    <script src="language.js"></script>

  </body>
</html>
