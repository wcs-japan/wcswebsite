<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ | White Coat Society Japan</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="contact.css" />
  </head>

  <body>
    <header class="header">
      <nav class="nav">
        <a href="index.html">ホーム</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
    </header>

    <section class="contact-hero">
      <h1>- お問い合わせ -</h1>
      <p>Contact info</p>
    </section>

    <main class="contact-container">
      <div class="contact-list">
        <div class="contact-info" id="email-card">
          <div class="icon-box">
            <i class="fa-regular fa-envelope"></i>
          </div>

          <span id="email-text">
            whitecoatsociety.japan@gmail.com
          </span>
        </div>

        <a
          href="https://www.instagram.com/wcs_japan/"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-info instagram"
        >
          <div class="icon-box instagram-icon">
            <i class="fa-brands fa-instagram"></i>
          </div>

          <span>whitecoatsociety.japan</span>
        </a>
      </div>

      <section class="form-section">
        <h2>お問い合わせフォーム↓</h2>

        <form id="contact-form">
          <div class="form-group">
            <label for="name">お名前</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="お名前を入力してください"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">件名</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="件名を入力してください"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">お問い合わせ内容</label>
            <textarea
              id="message"
              name="message"
              rows="7"
              placeholder="お問い合わせ内容を入力してください"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            送信
            <i class="fa-solid fa-paper-plane"></i>
          </button>

          <p id="form-error" class="form-error"></p>
        </form>
      </section>
    </main>

    <a
      href="https://discord.gg/mYD9qf7tH"
      target="_blank"
      rel="noopener noreferrer"
      class="discord-btn"
      aria-label="Discord"
    >
      <i class="fa-brands fa-discord"></i>
    </a>

    <div id="toast" class="toast">
      アドレスをコピーしました
    </div>

    <div id="success-popup" class="success-popup">
      <div class="success-popup-content">
        <div class="success-icon">
          <i class="fa-solid fa-check"></i>
        </div>

        <h3>送信をしました</h3>

        <p>
          お問い合わせありがとうございます。<br />
          内容を確認後、ご連絡いたします。
        </p>

        <button id="close-success-popup">OK</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
